<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商城 - PawMate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body, html {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        .product-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .product-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }
        .category-chip {
            white-space: nowrap;
            transition: all 0.2s ease;
        }
        .category-chip.active {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
        }
        .banner {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .price-badge {
            background: linear-gradient(135deg, #f59e0b, #d97706);
        }
        .shop-container {
            height: calc(100vh - 60px);
            overflow-y: auto;
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- 导航栏 -->
    <div class="bg-white px-4 py-3 flex items-center justify-between border-b border-gray-100">
        <h1 class="text-xl font-bold text-gray-900">商城</h1>
        <div class="flex items-center gap-3">
            <button class="p-2 rounded-full bg-blue-50 text-blue-600">
                <i class="fas fa-search text-lg"></i>
            </button>
            <button class="p-2 rounded-full bg-red-50 text-red-600 relative">
                <i class="fas fa-shopping-cart text-lg"></i>
                <div class="absolute -top-1 -right-1 w-5 h-5 bg-red-500 rounded-full flex items-center justify-center">
                    <span class="text-xs text-white font-bold">3</span>
                </div>
            </button>
        </div>
    </div>

    <div class="shop-container">
        <!-- 轮播横幅 -->
        <div class="banner p-6 m-4 rounded-2xl text-white">
            <h2 class="text-xl font-bold mb-2">新品上市</h2>
            <p class="text-sm opacity-90 mb-4">精选宠物用品，让你的毛孩子更快乐</p>
            <button class="bg-white text-blue-600 px-4 py-2 rounded-lg font-medium text-sm">
                立即选购
            </button>
        </div>

        <!-- 分类标签 -->
        <div class="px-4 mb-6">
            <div class="flex gap-3 overflow-x-auto pb-2">
                <div class="category-chip active bg-blue-600 text-white px-4 py-2 rounded-full text-sm font-medium">
                    热门
                </div>
                <div class="category-chip bg-white border border-gray-200 px-4 py-2 rounded-full text-sm font-medium text-gray-700">
                    食物
                </div>
                <div class="category-chip bg-white border border-gray-200 px-4 py-2 rounded-full text-sm font-medium text-gray-700">
                    玩具
                </div>
                <div class="category-chip bg-white border border-gray-200 px-4 py-2 rounded-full text-sm font-medium text-gray-700">
                    用品
                </div>
                <div class="category-chip bg-white border border-gray-200 px-4 py-2 rounded-full text-sm font-medium text-gray-700">
                    服饰
                </div>
                <div class="category-chip bg-white border border-gray-200 px-4 py-2 rounded-full text-sm font-medium text-gray-700">
                    保健
                </div>
            </div>
        </div>

        <!-- 快捷入口 -->
        <div class="px-4 mb-6">
            <div class="grid grid-cols-4 gap-4">
                <div class="bg-white rounded-2xl p-3 text-center">
                    <div class="w-12 h-12 bg-orange-100 rounded-full flex items-center justify-center mx-auto mb-2">
                        <i class="fas fa-bone text-orange-600 text-lg"></i>
                    </div>
                    <span class="text-xs text-gray-700">狗粮</span>
                </div>
                
                <div class="bg-white rounded-2xl p-3 text-center">
                    <div class="w-12 h-12 bg-pink-100 rounded-full flex items-center justify-center mx-auto mb-2">
                        <i class="fas fa-heart text-pink-600 text-lg"></i>
                    </div>
                    <span class="text-xs text-gray-700">零食</span>
                </div>
                
                <div class="bg-white rounded-2xl p-3 text-center">
                    <div class="w-12 h-12 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-2">
                        <i class="fas fa-baseball-ball text-green-600 text-lg"></i>
                    </div>
                    <span class="text-xs text-gray-700">玩具</span>
                </div>
                
                <div class="bg-white rounded-2xl p-3 text-center">
                    <div class="w-12 h-12 bg-purple-100 rounded-full flex items-center justify-center mx-auto mb-2">
                        <i class="fas fa-tshirt text-purple-600 text-lg"></i>
                    </div>
                    <span class="text-xs text-gray-700">服装</span>
                </div>
            </div>
        </div>

        <!-- 热门商品 -->
        <div class="px-4">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-lg font-bold text-gray-900">热门商品</h3>
                <button class="text-blue-600 text-sm font-medium">查看全部</button>
            </div>
            
            <div class="grid grid-cols-2 gap-4">
                <!-- 商品1 -->
                <div class="product-card bg-white rounded-2xl overflow-hidden">
                    <div class="relative">
                        <img src="https://images.unsplash.com/photo-1581888227599-779811939961?auto=format&fit=crop&w=300&h=200" 
                             alt="优质狗粮" class="w-full h-32 object-cover">
                        <div class="absolute top-2 right-2 price-badge text-white px-2 py-1 rounded-full text-xs font-bold">
                            热销
                        </div>
                    </div>
                    <div class="p-3">
                        <h4 class="font-medium text-gray-900 mb-1 text-sm">皇家优质成犬粮</h4>
                        <p class="text-xs text-gray-500 mb-2">营养均衡，适合成年犬</p>
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-1">
                                <span class="text-red-600 font-bold text-lg">¥89</span>
                                <span class="text-gray-400 line-through text-xs">¥129</span>
                            </div>
                            <button class="bg-blue-600 text-white w-8 h-8 rounded-full flex items-center justify-center">
                                <i class="fas fa-plus text-xs"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 商品2 -->
                <div class="product-card bg-white rounded-2xl overflow-hidden">
                    <div class="relative">
                        <img src="https://images.unsplash.com/photo-1601758228041-f3b2795255f1?auto=format&fit=crop&w=300&h=200" 
                             alt="互动玩具" class="w-full h-32 object-cover">
                        <div class="absolute top-2 right-2 bg-green-500 text-white px-2 py-1 rounded-full text-xs font-bold">
                            新品
                        </div>
                    </div>
                    <div class="p-3">
                        <h4 class="font-medium text-gray-900 mb-1 text-sm">智能互动球</h4>
                        <p class="text-xs text-gray-500 mb-2">自动滚动，增加运动量</p>
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-1">
                                <span class="text-red-600 font-bold text-lg">¥158</span>
                            </div>
                            <button class="bg-blue-600 text-white w-8 h-8 rounded-full flex items-center justify-center">
                                <i class="fas fa-plus text-xs"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 商品3 -->
                <div class="product-card bg-white rounded-2xl overflow-hidden">
                    <div class="relative">
                        <img src="https://images.unsplash.com/photo-1535294435445-d7249524ef2e?auto=format&fit=crop&w=300&h=200" 
                             alt="舒适窝垫" class="w-full h-32 object-cover">
                    </div>
                    <div class="p-3">
                        <h4 class="font-medium text-gray-900 mb-1 text-sm">舒适保暖窝垫</h4>
                        <p class="text-xs text-gray-500 mb-2">柔软舒适，四季通用</p>
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-1">
                                <span class="text-red-600 font-bold text-lg">¥78</span>
                                <span class="text-gray-400 line-through text-xs">¥98</span>
                            </div>
                            <button class="bg-blue-600 text-white w-8 h-8 rounded-full flex items-center justify-center">
                                <i class="fas fa-plus text-xs"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 商品4 -->
                <div class="product-card bg-white rounded-2xl overflow-hidden">
                    <div class="relative">
                        <img src="https://images.unsplash.com/photo-1583512603805-3cc6b41f3edb?auto=format&fit=crop&w=300&h=200" 
                             alt="营养零食" class="w-full h-32 object-cover">
                        <div class="absolute top-2 right-2 bg-yellow-500 text-white px-2 py-1 rounded-full text-xs font-bold">
                            特惠
                        </div>
                    </div>
                    <div class="p-3">
                        <h4 class="font-medium text-gray-900 mb-1 text-sm">鸡肉训练零食</h4>
                        <p class="text-xs text-gray-500 mb-2">高蛋白，训练必备</p>
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-1">
                                <span class="text-red-600 font-bold text-lg">¥29</span>
                                <span class="text-gray-400 line-through text-xs">¥39</span>
                            </div>
                            <button class="bg-blue-600 text-white w-8 h-8 rounded-full flex items-center justify-center">
                                <i class="fas fa-plus text-xs"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 限时秒杀 -->
        <div class="px-4 mt-8">
            <div class="bg-gradient-to-r from-red-500 to-pink-500 rounded-2xl p-4 text-white mb-4">
                <div class="flex items-center justify-between mb-3">
                    <h3 class="text-lg font-bold">限时秒杀</h3>
                    <div class="flex items-center gap-2 bg-black bg-opacity-20 px-3 py-1 rounded-full">
                        <i class="fas fa-clock text-sm"></i>
                        <span class="text-sm font-medium">02:15:30</span>
                    </div>
                </div>
                
                <div class="flex gap-3 overflow-x-auto">
                    <div class="bg-white rounded-2xl p-3 min-w-0 flex-shrink-0" style="width: 120px;">
                        <img src="https://images.unsplash.com/photo-1518717758536-85ae29035b6d?auto=format&fit=crop&w=200&h=150" 
                             alt="秒杀商品" class="w-full h-16 object-cover rounded-lg mb-2">
                        <div class="text-center">
                            <p class="text-xs text-gray-900 font-medium mb-1">宠物牵引绳</p>
                            <div class="flex items-center justify-center gap-1">
                                <span class="text-red-600 font-bold text-sm">¥19</span>
                                <span class="text-gray-400 line-through text-xs">¥49</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="bg-white rounded-2xl p-3 min-w-0 flex-shrink-0" style="width: 120px;">
                        <img src="https://images.unsplash.com/photo-1534361960057-19889db9621e?auto=format&fit=crop&w=200&h=150" 
                             alt="秒杀商品" class="w-full h-16 object-cover rounded-lg mb-2">
                        <div class="text-center">
                            <p class="text-xs text-gray-900 font-medium mb-1">不锈钢食盆</p>
                            <div class="flex items-center justify-center gap-1">
                                <span class="text-red-600 font-bold text-sm">¥15</span>
                                <span class="text-gray-400 line-through text-xs">¥35</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 为你推荐 -->
        <div class="px-4 mt-6 pb-6">
            <h3 class="text-lg font-bold text-gray-900 mb-4">为你推荐</h3>
            
            <div class="space-y-4">
                <div class="bg-white rounded-2xl p-4 flex gap-3">
                    <img src="https://images.unsplash.com/photo-1605568427561-40dd23c2acea?auto=format&fit=crop&w=150&h=150" 
                         alt="推荐商品" class="w-20 h-20 object-cover rounded-lg">
                    <div class="flex-1">
                        <h4 class="font-medium text-gray-900 mb-1">宠物洗护套装</h4>
                        <p class="text-xs text-gray-500 mb-2">温和配方，深层清洁不伤皮肤</p>
                        <div class="flex items-center justify-between">
                            <span class="text-red-600 font-bold text-lg">¥128</span>
                            <button class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm">
                                加入购物车
                            </button>
                        </div>
                    </div>
                </div>
                
                <div class="bg-white rounded-2xl p-4 flex gap-3">
                    <img src="https://images.unsplash.com/photo-1554995207-c18c203602cb?auto=format&fit=crop&w=150&h=150" 
                         alt="推荐商品" class="w-20 h-20 object-cover rounded-lg">
                    <div class="flex-1">
                        <h4 class="font-medium text-gray-900 mb-1">宠物航空箱</h4>
                        <p class="text-xs text-gray-500 mb-2">出行必备，安全舒适</p>
                        <div class="flex items-center justify-between">
                            <span class="text-red-600 font-bold text-lg">¥268</span>
                            <button class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm">
                                加入购物车
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
